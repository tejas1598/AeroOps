spring.application.name=spring-core-demo
spring.config.import=optional:file:./spring-core-demo/.env[.properties],optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:${POSTGRES_DB:aeroops-featured}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.springframework.security=DEBUG
jwt.secret=${JWT_SECRET}
jwt.expiration = 300000
