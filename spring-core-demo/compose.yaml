services:
  app:
    image: aeroops:multistage-test
    environment:
      DB_HOST: db
    ports:
      - "8080:8080"

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: 860540
      POSTGRES_DB: aeroops
    volumes:
      - aeroops-postgres-data:/var/lib/postgresql

volumes:
  aeroops-postgres-data: