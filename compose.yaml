services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - app

  app:
    build:
      context: ./spring-core-demo
      dockerfile: Dockerfile.multistage
    image: aeroops:local
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-${DB_NAME:-aeroops-featured}}
      DB_USERNAME: ${DB_USERNAME:-${POSTGRES_USER:-postgres}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:?Set DB_PASSWORD in spring-core-demo/.env}}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in spring-core-demo/.env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8080"

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aeroops-featured}
      POSTGRES_USER: ${DB_USERNAME:-${POSTGRES_USER:-postgres}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:?Set DB_PASSWORD in spring-core-demo/.env}}
    volumes:
      - aeroops-postgres-data:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-${POSTGRES_USER:-postgres}} -d ${POSTGRES_DB:-${DB_NAME:-aeroops-featured}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  aeroops-postgres-data:
